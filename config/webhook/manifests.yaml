---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-sops-maesh-dev-v1alpha1-sopssecret
  failurePolicy: Fail
  name: vsopssecret-v1alpha1.kb.io
  rules:
  - apiGroups:
    - sops.maesh.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - sopssecrets
  sideEffects: None
