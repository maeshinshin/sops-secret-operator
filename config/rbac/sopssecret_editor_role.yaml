# This rule is not used by the project sops-secret-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sops.maesh.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sops-secret-operator
    app.kubernetes.io/managed-by: kustomize
  name: sopssecret-editor-role
rules:
- apiGroups:
  - sops.maesh.dev
  resources:
  - sopssecrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sops.maesh.dev
  resources:
  - sopssecrets/status
  verbs:
  - get
